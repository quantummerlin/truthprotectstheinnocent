<!--
===========================================
STATS COUNTER COMPONENT
===========================================
A live-updating counter showing growing support
Add this to your homepage or any prominent location
===========================================
-->

<style>
.stats-counter-wrapper {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 20px;
    padding: 30px;
    color: white;
    max-width: 800px;
    margin: 0 auto;
}
.stats-counter-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}
.stats-live-indicator {
    background: #e74c3c;
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
.stats-counter-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #ccc;
}
.stats-counter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}
.stat-item {
    text-align: center;
    padding: 20px 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
}
.stat-item.highlight {
    background: linear-gradient(135deg, #27ae60, #2ecc71);
}
.stat-number {
    font-size: 2.5rem;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 8px;
}
.stat-label {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 8px;
}
.stat-item.highlight .stat-label {
    color: rgba(255,255,255,0.9);
}
.stat-change {
    font-size: 0.75rem;
    color: #888;
}
.stat-change.up {
    color: #2ecc71;
}
.stats-counter-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 0.85rem;
    color: #888;
}
.stats-link {
    color: #f39c12;
    text-decoration: none;
    font-weight: 600;
}
@media (max-width: 600px) {
    .stats-counter-grid {
        grid-template-columns: repeat(2, 1fr);
    }
    .stat-number {
        font-size: 2rem;
    }
}
</style>

<div class="stats-counter-wrapper">
    <div class="stats-counter-header">
        <span class="stats-live-indicator">● LIVE</span>
        <span class="stats-counter-title">Support Tracker</span>
    </div>
    
    <div class="stats-counter-grid">
        <div class="stat-item">
            <div class="stat-number" id="stat-comments">1,344</div>
            <div class="stat-label">Public Comments</div>
            <div class="stat-change up">↑ 4 platforms</div>
        </div>
        
        <div class="stat-item">
            <div class="stat-number" id="stat-voices">1,130</div>
            <div class="stat-label">Unique Voices</div>
            <div class="stat-change up">↑ Growing daily</div>
        </div>
        
        <div class="stat-item highlight">
            <div class="stat-number" id="stat-support">96%</div>
            <div class="stat-label">Support Family</div>
            <div class="stat-change">Across platforms</div>
        </div>
        
        <div class="stat-item">
            <div class="stat-number" id="stat-countries">12+</div>
            <div class="stat-label">Countries</div>
            <div class="stat-change up">↑ International</div>
        </div>
    </div>
    
    <div class="stats-counter-footer">
        <span>Last updated: <span id="stats-date">March 2026</span></span>
        <a href="/public-voice/" class="stats-link">See all comments →</a>
    </div>
</div>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
